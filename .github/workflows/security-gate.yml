name: Security Gate

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  pull-requests: write
  issues: write

jobs:
  security-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run security gate (high blocks, medium warns)
        id: gate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/security/security-gate.mjs \
            --repo "${{ github.repository }}" \
            --out reports/security/security-gate-result.json

      - name: Publish PR warning comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const marker = "<!-- security-gate-report -->";
            const path = "reports/security/security-gate-result.json";

            if (!fs.existsSync(path)) {
              core.warning(`Missing gate result file: ${path}`);
              return;
            }

            const result = JSON.parse(fs.readFileSync(path, "utf8"));
            const disabled =
              Array.isArray(result.disabled_sources) && result.disabled_sources.length > 0
                ? result.disabled_sources.join(", ")
                : "none";
            const highStatus =
              result.blocking_high_count > 0
                ? `FAIL (${result.blocking_high_count} open high/critical alert(s))`
                : "PASS (no open high/critical alerts)";
            const mediumStatus =
              result.medium_count > 0
                ? `WARNING (${result.medium_count} open medium alert(s))`
                : "PASS (no open medium alerts)";

            const body = [
              marker,
              "## Security Gate Result",
              `- Unique open alerts: **${result.total_unique_alerts}**`,
              `- Severity: critical=${result.severity.critical}, high=${result.severity.high}, medium=${result.severity.medium}, low=${result.severity.low}, unknown=${result.severity.unknown}`,
              `- High threshold: ${highStatus}`,
              `- Medium threshold: ${mediumStatus}`,
              `- Disabled sources: ${disabled}`,
              result.collection_error
                ? `- Collection error: ${result.collection_error}`
                : null,
            ].filter(Boolean).join("\n");

            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                typeof comment.body === "string" &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Enforce gate
        run: |
          node -e "const fs=require('fs');const path='reports/security/security-gate-result.json';if(!fs.existsSync(path)){console.error('Security gate failed: missing result file.');process.exit(1);}const r=JSON.parse(fs.readFileSync(path,'utf8'));if(r.collection_error){console.error('Security gate failed: unable to collect alerts data.');console.error(r.collection_error);process.exit(1);}if((r.blocking_high_count??0)>0){console.error('Security gate failed: open high/critical alerts detected.');process.exit(1);}console.log('Security gate passed: no open high/critical alerts.');"
