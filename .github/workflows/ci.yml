name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Start database-only Supabase
        shell: bash
        run: |
          nohup bash -c '
            supabase db start > "$RUNNER_TEMP/supabase-db-start.log" 2>&1
            echo "$?" > "$RUNNER_TEMP/supabase-db-start.status"
          ' >/dev/null 2>&1 &

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for database-only Supabase
        shell: bash
        run: |
          for _ in {1..180}; do
            if [[ -f "$RUNNER_TEMP/supabase-db-start.status" ]]; then
              status="$(cat "$RUNNER_TEMP/supabase-db-start.status")"
              cat "$RUNNER_TEMP/supabase-db-start.log"
              exit "$status"
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/supabase-db-start.log"
          echo "Timed out while starting database-only Supabase." >&2
          exit 1

      - name: Run required verification
        run: pnpm verify
