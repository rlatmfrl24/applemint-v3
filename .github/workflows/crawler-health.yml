name: Crawler Health

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      delivery_test:
        description: Create, comment on, and close a test issue without reading Supabase
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: crawler-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Deliver crawler health issues
        env:
          DELIVERY_TEST: ${{ inputs.delivery_test || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          CRAWL_INTERNAL_SECRET: ${{ secrets.CRAWL_INTERNAL_SECRET }}
        run: node scripts/crawler-health/monitor.mjs
